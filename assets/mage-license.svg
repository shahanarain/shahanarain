<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Mage License for shahanarain: rank Apprentice Mage, 17 contributions in the past year, 9 public repos, 0 stars, 1 followers">
<defs>
  <linearGradient id="m-gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff3c9"/><stop offset=".5" stop-color="#e9b54c"/><stop offset="1" stop-color="#9c6a17"/>
  </linearGradient>
  <radialGradient id="m-bg" cx=".15" cy=".5" r="1">
    <stop offset="0" stop-color="#2a070d"/><stop offset=".5" stop-color="#16080b"/><stop offset="1" stop-color="#0b0607"/>
  </radialGradient>
  <filter id="m-glow" x="-20%" y="-50%" width="140%" height="200%">
    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d11a33" flood-opacity=".7"/>
  </filter>
  <linearGradient id="mana" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d11a33"/><stop offset="1" stop-color="#ff3b4e"/></linearGradient>
  <clipPath id="barclip"><rect x="392" y="196" width="580" height="10" rx="5"/></clipPath>
</defs>
<style>
  .crest { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
  .seal { transform-box: fill-box; transform-origin: center; animation: spin 50s linear infinite; }
  .mana { animation: fill 2.2s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; transform-origin: left center; }
  @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 3px #ff3b4e); } 50% { filter: drop-shadow(0 0 12px #ff3b4e); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .crest, .seal, .mana { animation: none; } }
</style>
<rect x="1" y="1" width="998" height="318" rx="18" fill="url(#m-bg)" stroke="#e9b54c" stroke-opacity=".3" stroke-width="2"/>

<!-- license card -->
<g transform="translate(30 30)">
