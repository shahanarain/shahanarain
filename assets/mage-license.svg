  <rect x="8" y="8" width="314" height="244" rx="10" fill="none" stroke="#e9b54c" stroke-opacity=".25" stroke-dasharray="2 4"/>
  <text x="165" y="36" text-anchor="middle" font-family="Verdana, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#ff3b4e">✦ MAGE LICENSE ✦</text>
  <g transform="translate(165 104)">
    <g><circle class="seal" r="46" fill="none" stroke="#e9b54c" stroke-opacity=".55" stroke-dasharray="4 5"/></g>
    <circle r="38" fill="#1a070b" stroke="#e9b54c" stroke-opacity=".35"/>
    <g transform="scale(.62)"><g class="crest"><g fill="#120205" stroke="#ff3b4e" stroke-width="2"><path d="M0 -4 C -4 -14 -26 -18 -26 -36 C -26 -48 -12 -52 0 -40 C 12 -52 26 -48 26 -36 C 26 -18 4 -14 0 -4 Z" transform="rotate(0)"/><path d="M0 -4 C -4 -14 -26 -18 -26 -36 C -26 -48 -12 -52 0 -40 C 12 -52 26 -48 26 -36 C 26 -18 4 -14 0 -4 Z" transform="rotate(72)"/><path d="M0 -4 C -4 -14 -26 -18 -26 -36 C -26 -48 -12 -52 0 -40 C 12 -52 26 -48 26 -36 C 26 -18 4 -14 0 -4 Z" transform="rotate(144)"/><path d="M0 -4 C -4 -14 -26 -18 -26 -36 C -26 -48 -12 -52 0 -40 C 12 -52 26 -48 26 -36 C 26 -18 4 -14 0 -4 Z" transform="rotate(216)"/><path d="M0 -4 C -4 -14 -26 -18 -26 -36 C -26 -48 -12 -52 0 -40 C 12 -52 26 -48 26 -36 C 26 -18 4 -14 0 -4 Z" transform="rotate(288)"/><circle r="5" fill="#e9b54c" stroke="none"/></g></g></g>
  </g>
  <text x="165" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="url(#m-gold)" filter="url(#m-glow)">shahanarain</text>
  <text x="165" y="206" text-anchor="middle" font-family="Verdana, 'Segoe UI', sans-serif" font-size="12" letter-spacing="2" fill="#efe6d8">RANK · APPRENTICE MAGE</text>
  <text x="165" y="236" text-anchor="middle" font-family="Verdana, 'Segoe UI', sans-serif" font-size="10" fill="#a8927a">@shahanarain · Mage since 2024</text>
</g>

