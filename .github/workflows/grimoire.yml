name: Grimoire

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: grimoire
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Forge Mage License (live stats)
        run: node scripts/mage-license.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit updated license
        run: |
          if git diff --quiet -- assets/mage-license.svg; then
            echo "Stats unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/mage-license.svg
            git commit -m "chore: update mage license"
            git push
          fi

      - name: Summon battle snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/grimoire-snake.svg?color_snake=#ff3b4e&color_dots=#1c1214,#4a0a14,#7a0f1f,#b3132a,#e9b54c

      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
